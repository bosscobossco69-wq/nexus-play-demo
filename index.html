<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS PLAY · 演示游戏平台</title>
<style>
:root{--bg:#06111f;--panel:#0c2036;--panel2:#102a45;--line:#1d4261;--text:#eaf6ff;--muted:#91b5d0;--cyan:#55d9ff;--blue:#398cff;--green:#67f0c2;--red:#ff718e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#163f69 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{padding:24px 16px;border-right:1px solid #18334c;background:#071626;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brand-mark{height:42px;width:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#2c8cff,#55e1ff);color:#061426;font-weight:900;font-size:22px;box-shadow:0 0 30px #299bff40}.brand strong{letter-spacing:1.5px;font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.5px}.nav-label{color:#6488a6;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;padding:0 12px}.nav{display:grid;gap:6px}.nav button{color:#9bbbd4;background:transparent;text-align:left;padding:12px;border-radius:12px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#112e49;color:#eafaff}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.nav-icon{width:22px;text-align:center;font-size:18px}.side-note{margin-top:auto;padding:14px;border:1px solid var(--line);background:#0b2034;border-radius:14px;color:var(--muted);font-size:12px}.side-note b{display:block;color:var(--cyan);margin-bottom:5px}.main{min-width:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #17334c;background:#071626b8;backdrop-filter:blur(14px);position:sticky;top:0;z-index:3}.crumb{color:var(--muted);font-size:13px}.user-area{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:12px;background:#173a59;display:grid;place-items:center;color:var(--cyan);font-weight:800}.btn{padding:10px 15px;border-radius:10px;background:#15334e;color:var(--text);border:1px solid #285171}.btn.primary{background:linear-gradient(135deg,#278cff,#4ed7ff);color:#041525;font-weight:800;border:0}.btn:hover{filter:brightness(1.12)}.content{padding:28px 30px 50px;max-width:1450px;margin:auto}.eyebrow{font-size:11px;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;font-weight:800}.hero{padding:28px;border-radius:22px;border:1px solid #235174;background:linear-gradient(115deg,#102d4aee,#0a1c30 68%),radial-gradient(circle at 90% 30%,#126b9d,transparent 40%);position:relative;overflow:hidden;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #5ddcff26;border-radius:50%;right:6%;top:-110px;box-shadow:0 0 0 32px #5ddcff0b,0 0 0 64px #5ddcff08}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:10px 0 12px;max-width:620px}.hero p{color:#a4c4dc;max-width:560px;margin:0 0 20px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.hero-balance{z-index:1;min-width:220px;background:#071a2bcc;border:1px solid #2c5875;padding:18px;border-radius:16px}.hero-balance span{color:var(--muted);font-size:12px}.hero-balance strong{display:block;font-size:28px;margin:7px 0;color:#fff}.hero-balance small{color:var(--cyan)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 15px}.section-head h2{margin:0;font-size:21px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat,.card{background:linear-gradient(145deg,#0d2339,#0a1b2d);border:1px solid #1a3a55;border-radius:16px;padding:18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:8px}.stat-icon{color:var(--cyan);font-size:20px}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.game{border:1px solid #1b405e;border-radius:17px;overflow:hidden;background:#0b2034}.game-art{height:135px;display:grid;place-items:center;font-size:52px;position:relative;background:radial-gradient(circle at 50% 20%,#286f9a,#0e2945 65%,#091827)}.game-art:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07152580,transparent)}.game-info{padding:15px}.game-info h3{margin:0 0 5px}.game-info p{color:var(--muted);font-size:12px;margin:0 0 13px}.game-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:10px;border:1px solid #286080;color:var(--cyan);padding:4px 7px;border-radius:20px}.page-title{margin:0 0 5px;font-size:28px}.sub{color:var(--muted);margin:0 0 24px}.panel{background:#0b1e31;border:1px solid #1c3d58;border-radius:16px;overflow:hidden}.panel-head{padding:18px;border-bottom:1px solid #1a3851;display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h3{margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #17334b;font-size:13px}th{color:#7399b8;font-weight:600;background:#0d2439}td{color:#cfe3f3}.positive{color:var(--green)}.negative{color:var(--red)}.form{max-width:520px;display:grid;gap:14px}.field{display:grid;gap:7px;color:#a9c6dd;font-size:13px}.field input,.field select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #284b66;background:#071827;color:#fff;outline:none}.field input:focus{border-color:var(--cyan)}.notice{border:1px solid #27516d;background:#0d2940;padding:13px 15px;border-radius:12px;color:#a9c9df;font-size:13px}.empty{padding:40px;text-align:center;color:var(--muted)}.mobile-menu{display:none}.footer-note{color:#577e9e;font-size:11px;margin-top:30px;text-align:center}.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:66px;padding:0 16px}.content{padding:18px 16px 40px}.mobile-menu{display:inline-flex}.hero{align-items:flex-start;flex-direction:column;padding:22px}.hero-balance{width:100%}.games{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr}.topbar .crumb{display:none}}
@media(max-width:520px){.games{grid-template-columns:1fr}.game-art{height:155px}.hero h1{font-size:30px}.content{padding:14px 12px 32px}.user-area .btn{padding:8px 10px}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">N</div><div><strong>NEXUS PLAY</strong><small>DEMO PLATFORM</small></div></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" id="sideNav">
    <button data-page="home" class="active"><span class="nav-icon">⌂</span>总览首页</button>
    <button data-page="games"><span class="nav-icon">▣</span>游戏大厅</button>
    <button data-page="profile"><span class="nav-icon">♙</span>会员中心</button>
    <button data-page="wallet"><span class="nav-icon">◇</span>模拟钱包</button>
  </nav></div>
  <div><div class="nav-label">Management</div><nav class="nav">
    <button data-page="admin"><span class="nav-icon">⚙</span>管理后台</button>
  </nav></div>
  <div class="side-note"><b>◈ 演示模式已启用</b>余额仅为虚拟积分，不具备现金价值。此版本不接入真实支付或提现。</div>
</aside>
<main class="main">
<header class="topbar"><div class="user-area"><button class="btn mobile-menu" id="menuBtn">☰</button><span class="crumb">NEXUS PLAY / <span id="crumb">总览首页</span></span></div><div class="user-area"><span class="tag">DEMO MODE</span><div class="avatar" id="avatar">G</div><span id="userName">Guest</span><button class="btn" id="loginTop">登录</button></div></header>
<div class="content" id="view"></div>
</main></div>
<script>
const KEY='nexus_play_demo_v1';
const initial={user:null,balance:10000,tx:[{id:'TX-1001',date:new Date().toLocaleString('zh-CN'),type:'系统赠送',amount:10000,note:'演示账户初始积分'}],gamesPlayed:0};
let state;
try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){state={...initial};}
if(!Array.isArray(state.tx))state.tx=initial.tx;
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function tx(type,amount,note){state.tx.unshift({id:'TX-'+Date.now().toString().slice(-8),date:new Date().toLocaleString('zh-CN'),type,amount,note});save();}
const pages={home:'总览首页',games:'游戏大厅',profile:'会员中心',wallet:'模拟钱包',admin:'管理后台',login:'会员登录'};
function nav(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=pages[page]||'游戏试玩';render(page);}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
$('#menuBtn').onclick=()=>{const side=$('.sidebar');side.style.display=side.style.display==='flex'?'none':'flex';side.style.position='absolute';side.style.zIndex='10';side.style.height='100%';side.style.width='245px';};
$('#loginTop').onclick=()=>nav('login');
function header(title,sub){return `<h1 class="page-title">${title}</h1><p class="sub">${sub}</p>`}
function gameCards(){return `<div class="games">
<div class="game"><div class="game-art">🧠</div><div class="game-info"><h3>记忆矩阵</h3><p>训练你的记忆力 · 纯技巧小游戏</p><div class="game-row"><span class="tag">益智挑战</span><button class="btn primary" onclick="playGame('memory')">开始试玩</button></div></div></div>
<div class="game"><div class="game-art">🃏</div><div class="game-info"><h3>幸运翻牌</h3><p>翻开卡片，看看能否找到配对</p><div class="game-row"><span class="tag">休闲游戏</span><button class="btn primary" onclick="playGame('cards')">开始试玩</button></div></div></div>
<div class="game"><div class="game-art">🎯</div><div class="game-info"><h3>精准挑战</h3><p>在目标区域点击，挑战反应力</p><div class="game-row"><span class="tag">反应训练</span><button class="btn primary" onclick="playGame('target')">开始试玩</button></div></div></div>
</div>`}
function render(page='home'){
const v=$('#view');$('#userName').textContent=state.user?.name||'Guest';$('#avatar').textContent=(state.user?.name||'G').slice(0,1).toUpperCase();$('#loginTop').textContent=state.user?'退出':'登录';
if(state.user)$('#loginTop').onclick=()=>{state.user=null;save();render(page)};
if(page==='home')v.innerHTML=`<section class="hero"><div><div class="eyebrow">WELCOME TO NEXUS</div><h1>探索你的下一场<br><span style="color:var(--cyan)">数字娱乐体验</span></h1><p>一个为试玩、探索和轻松娱乐而设计的科技风游戏平台。所有积分均为虚拟演示数据。</p><div class="hero-actions"><button class="btn primary" onclick="nav('games')">进入游戏大厅　→</button><button class="btn" onclick="nav('profile')">会员中心</button></div></div><div class="hero-balance"><span>模拟账户余额</span><strong>${fmt(state.balance)}</strong><small>✦ DEMO CREDITS</small></div></section>
<div class="stats"><div class="stat"><div class="stat-top"><span>可用模拟积分</span><span class="stat-icon">◇</span></div><strong>${fmt(state.balance)}</strong></div><div class="stat"><div class="stat-top"><span>已试玩次数</span><span class="stat-icon">▣</span></div><strong>${state.gamesPlayed}</strong></div><div class="stat"><div class="stat-top"><span>交易记录</span><span class="stat-icon">↗</span></div><strong>${state.tx.length}</strong></div></div>
<div class="section-head"><div><h2>精选试玩</h2><p>无需真钱 · 即点即玩</p></div><button class="btn" onclick="nav('games')">查看全部 →</button></div>${gameCards()}
<div class="footer-note">NEXUS PLAY 是独立演示项目，与 SA969 无关联。所有积分均无现金价值。</div>`;
if(page==='games')v.innerHTML=header('游戏大厅','选择一款小游戏开始体验。所有游戏均为演示版本。')+`<div class="notice">ⓘ 本演示平台不包含真钱投注、充值或提现。游戏结果仅用于互动体验。</div><div class="section-head"><div><h2>全部游戏</h2><p>3 款原创试玩体验</p></div></div>${gameCards()}`;
if(page==='profile')v.innerHTML=header('会员中心','管理你的演示账号与个人资料。')+`<div class="panel"><div class="panel-head"><h3>个人资料</h3><span class="tag">DEMO MEMBER</span></div><div style="padding:20px"><div class="form"><label class="field">显示名称<input id="profileName" value="${esc(state.user?.name||'Guest Member')}" placeholder="输入显示名称"></label><label class="field">邮箱（演示字段）<input id="profileEmail" value="${esc(state.user?.email||'')}" placeholder="demo@example.com"></label><button class="btn primary" onclick="saveProfile()">保存资料</button><div class="notice">目前使用浏览器本地存储，仅用于原型测试。正式会员系统需要接入服务端身份验证。</div></div></div></div>`;
if(page==='wallet')v.innerHTML=header('模拟钱包','仅显示虚拟积分与本地演示交易记录。')+`<div class="hero" style="margin-bottom:18px"><div><div class="eyebrow">DEMO WALLET</div><h1 style="font-size:32px">积分余额</h1><p>积分不代表任何法定货币，不可充值、兑换或提现。</p></div><div class="hero-balance"><span>当前余额</span><strong>${fmt(state.balance)}</strong><small>DEMO CREDITS</small></div></div><div class="panel"><div class="panel-head"><h3>交易记录</h3><button class="btn" onclick="exportTx()">导出 CSV</button></div><div class="table-wrap"><table><thead><tr><th>交易编号</th><th>时间</th><th>类型</th><th>变动积分</th><th>说明</th></tr></thead><tbody>${state.tx.map(t=>`<tr><td>${t.id}</td><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td class="${t.amount>=0?'positive':'negative'}">${t.amount>=0?'+':''}${fmt(t.amount)}</td><td>${esc(t.note)}</td></tr>`).join('')}</tbody></table></div></div>`;
if(page==='admin')v.innerHTML=header('管理后台','原型管理视图。正式部署时必须在服务端实施管理员权限校验。')+`<div class="notice" style="margin-bottom:18px">⚠ 当前仅为前端演示。此页面没有真实权限隔离，不可直接用于生产环境。</div><div class="stats"><div class="stat"><div class="stat-top"><span>本地演示会员</span><span class="stat-icon">♙</span></div><strong>${state.user?1:0}</strong></div><div class="stat"><div class="stat-top"><span>游戏项目</span><span class="stat-icon">▣</span></div><strong>3</strong></div><div class="stat"><div class="stat-top"><span>积分流水</span><span class="stat-icon">◇</span></div><strong>${state.tx.length}</strong></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>演示积分工具</h3></div><div style="padding:18px"><div class="form"><label class="field">积分变动数量（可正可负）<input id="adminAmount" type="number" value="100" min="-10000" max="10000"></label><label class="field">操作说明<input id="adminNote" value="后台演示调整"></label><button class="btn primary" onclick="adminAdjust()">提交演示调整</button></div></div></div><div class="panel" style="margin-top:18px"><div class="panel-head"><h3>最近流水</h3></div><div class="table-wrap"><table><thead><tr><th>编号</th><th>类型</th><th>变动</th><th>说明</th></tr></thead><tbody>${state.tx.slice(0,8).map(t=>`<tr><td>${t.id}</td><td>${esc(t.type)}</td><td>${fmt(t.amount)}</td><td>${esc(t.note)}</td></tr>`).join('')}</tbody></table></div></div>`;
if(page==='login')v.innerHTML=header('会员登录','创建本地演示身份，不会向服务器发送个人资料。')+`<div class="panel" style="padding:22px"><div class="form"><label class="field">显示名称<input id="loginName" placeholder="例如：DemoUser"></label><label class="field">邮箱（可选）<input id="loginEmail" type="email" placeholder="demo@example.com"></label><button class="btn primary" onclick="demoLogin()">进入演示平台</button><div class="notice">这是原型登录，不是安全的真实账户系统。不要输入真实密码或敏感信息。</div></div></div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function demoLogin(){const name=$('#loginName').value.trim();if(!name){alert('请输入显示名称');return;}state.user={name,email:$('#loginEmail').value.trim()};save();nav('profile');}
function saveProfile(){const name=$('#profileName').value.trim();if(!name){alert('显示名称不能为空');return;}state.user={name,email:$('#profileEmail').value.trim()};save();render('profile');alert('演示资料已保存');}
function adminAdjust(){const amount=Number($('#adminAmount').value),note=$('#adminNote').value.trim()||'后台演示调整';if(!Number.isFinite(amount)||amount===0||Math.abs(amount)>10000){alert('请输入 1 至 10000 之间的正数或负数');return;}if(state.balance+amount<0){alert('模拟余额不足，不能扣成负数');return;}state.balance+=amount;tx('后台演示调整',amount,note);render('admin');}
function playGame(kind){
 state.gamesPlayed++;const title={memory:'记忆矩阵',cards:'幸运翻牌',target:'精准挑战'}[kind]||'小游戏';
 if(kind==='memory'){const seq=Array.from({length:4},()=>Math.floor(Math.random()*9)+1);alert('记忆数字：'+seq.join(' · ')+'\\n请记住它们！');const ans=prompt('按顺序输入这 4 个数字（用空格分隔）：');if(ans&&ans.trim().replace(/\\s+/g,'')===seq.join('')){alert('挑战成功！这是纯技巧游戏，不涉及积分投注。');}else{alert('本次挑战结束，再试一次吧！正确序列：'+seq.join(' '));}}
 else if(kind==='cards'){const a=Math.floor(Math.random()*5),b=Math.floor(Math.random()*5);alert('你翻开了两张卡片： '+['◆','●','▲','★','✦'][a]+' 和 '+['◆','●','▲','★','✦'][b]+'\\n'+(a===b?'配对成功！':'这次没有配对，继续练习！'));}
 else {const n=Math.floor(Math.random()*100);const g=prompt('精准挑战！猜一个 0 到 99 的数字：');if(g!==null)alert(Number(g)===n?'命中！反应与判断都不错。':'目标数字是 '+n+'，下次再挑战！');}
 save();nav('games');
}
function exportTx(){const rows=[['id','date','type','amount','note'],...state.tx.map(t=>[t.id,t.date,t.type,t.amount,t.note])];const csv='\\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='nexus-demo-transactions.csv';a.click();URL.revokeObjectURL(a.href);}
render('home');
</script>
</body>
</html>
